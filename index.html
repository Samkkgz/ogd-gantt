<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>项目管理系统 v2.0.0</title>
<meta name="description" content="项目管理系统 - 多项目管理平台">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"Microsoft YaHei","PingFang SC",sans-serif;background:#f5f7fa;color:#333;min-height:100vh}
.hide{display:none!important}

/* Loading */
#loadingScreen{position:fixed;inset:0;background:#f5f7fa;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999}
.spinner{width:40px;height:40px;border:4px solid #e6f0ff;border-top-color:#1890ff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loadingScreen p{margin-top:16px;color:#666;font-size:14px}

/* Login */
.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#e6f7ff,#f0f5ff)}
.login-card{background:#fff;border-radius:16px;padding:40px;width:380px;box-shadow:0 8px 40px rgba(0,0,0,.08);text-align:center}
.login-card h1{font-size:22px;margin-bottom:4px;color:#003a8c}
.login-card p{color:#888;font-size:13px;margin-bottom:24px}
.login-card input{width:100%;padding:12px 16px;border:1px solid #d9d9d9;border-radius:8px;font-size:15px;outline:none;transition:border .2s}
.login-card input:focus{border-color:#1890ff;box-shadow:0 0 0 3px rgba(24,144,255,.1)}
.login-card button{width:100%;padding:12px;background:#1890ff;color:#fff;border:none;border-radius:8px;font-size:15px;cursor:pointer;margin-top:12px;transition:background .2s}
.login-card button:hover{background:#40a9ff}
.login-card button:disabled{background:#bfbfbf;cursor:not-allowed}
.login-card .login-msg{margin-top:12px;font-size:13px;min-height:20px}
.login-card .login-msg.success{color:#52c41a}
.login-card .login-msg.error{color:#ff4d4f}

/* App Header */
.app-header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:#fff;border-bottom:1px solid #e8e8e8;flex-wrap:wrap;gap:8px}
.app-header h1{font-size:18px;display:flex;align-items:center;gap:8px}
.app-header h1 small{font-size:12px;font-weight:400;color:#888}
.user-info{display:flex;align-items:center;gap:12px;font-size:13px}
.user-info .user-badge{padding:2px 10px;border-radius:10px;font-size:11px;font-weight:600}
.badge-ECS{background:#e6f7ff;color:#003a8c}
.badge-嘉顿{background:#f6ffed;color:#237804}
.badge-admin{background:#fff7e6;color:#ad6800}
.badge-super_admin{background:#f9f0ff;color:#722ed1}
.user-info button{padding:6px 14px;border:1px solid #d9d9d9;border-radius:6px;background:#fff;cursor:pointer;font-size:12px}
.user-info button:hover{background:#f5f5f5}

/* Tab bar */
.tab-bar{display:flex;background:#fff;border-bottom:1px solid #e8e8e8;padding:0 20px}
.tab-bar button{padding:10px 20px;border:none;background:none;cursor:pointer;font-size:13px;color:#666;border-bottom:2px solid transparent;transition:all .2s}
.tab-bar button:hover{color:#1890ff}
.tab-bar button.active{color:#1890ff;border-bottom-color:#1890ff;font-weight:600}

/* Page content */
.page-content{padding:16px 20px;max-width:1600px}

/* Permission notice */
.permission-notice{background:#fff7e6;border:1px solid #ffe58f;border-radius:8px;padding:8px 14px;margin-bottom:12px;font-size:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.permission-notice .p-badge{padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600}

/* Toolbar */
.toolbar{display:flex;gap:6px;margin-bottom:10px;align-items:center;flex-wrap:wrap}
.toolbar button{padding:6px 12px;border:none;border-radius:6px;cursor:pointer;font-size:12px;transition:all .2s;white-space:nowrap}
.toolbar button:hover{filter:brightness(1.1);transform:translateY(-1px)}
.tb-primary{background:#1890ff;color:#fff}
.tb-success{background:#52c41a;color:#fff}
.tb-danger{background:#ff4d4f;color:#fff}
.tb-ghost{background:#f0f0f0;color:#555}
.tb-ghost:hover{background:#d9d9d9}
.tb-sep{width:1px;height:24px;background:#e0e0e0;margin:0 4px;flex-shrink:0}
.legend{display:flex;gap:10px;font-size:11px;align-items:center;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:3px}
.lc{width:14px;height:10px;border-radius:2px;flex-shrink:0}

/* Milestone overview */
.ms-bar{background:linear-gradient(135deg,#fff0f6,#f9f0ff);border:1px solid #ffadd2;border-radius:10px;padding:10px 14px;margin-bottom:12px}
.ms-bar h3{font-size:13px;color:#eb2f96;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.ms-timeline{display:flex;gap:4px;overflow-x:auto;padding-bottom:4px}
.ms-item{display:flex;flex-direction:column;align-items:center;min-width:64px;max-width:78px;cursor:pointer;padding:3px 5px;border-radius:6px;flex-shrink:0;transition:background .2s}
.ms-item:hover{background:rgba(235,47,150,.06)}
.ms-diamond{font-size:14px;line-height:1}
.ms-date{font-size:9px;color:#999;margin-top:1px}
.ms-label{font-size:10px;color:#333;text-align:center;line-height:1.2;font-weight:500;margin-top:1px}
.ms-phase{font-size:8px;color:#aaa}

/* === GANTT TABLE === */
.gantt-wrapper{overflow:auto;border-radius:10px;box-shadow:0 2px 12px rgba(0,0,0,.08);max-height:70vh;background:#fff}
.gantt-wrapper table{border-collapse:separate;border-spacing:0;font-size:13px;min-width:1000px}
.gantt-wrapper th,.gantt-wrapper td{border:1px solid #e8e8e8;padding:0;vertical-align:middle}
.gantt-wrapper th{background:#fafafa;font-weight:600;font-size:12px;color:#555;text-align:center}

/* === HEADER FREEZE (vertical) — thead cells are sticky-top === */
.date-header th{background:#e6f0ff;padding:4px 2px;font-size:11px;color:#333;border-bottom:2px solid #91d5ff}
.gantt-wrapper thead{position:sticky;top:0;z-index:32}.gantt-wrapper thead th{position:sticky;top:0}
.date-header+tr th{top:30px}

/* === FROZEN LEFT COLUMNS — sticky positioning (dynamic + static fallback) === */
td.fixed-phase{position:sticky;left:0px;z-index:10}
td.fixed-content{position:sticky;left:70px;z-index:10}
td.fixed-deliverable{position:sticky;left:170px;z-index:10}
td.fixed-company{position:sticky;left:340px;z-index:10}
td.fixed-responsible{position:sticky;left:395px;z-index:10}
td.fixed-status{position:sticky;left:480px;z-index:10}
td.fixed-milestone{position:sticky;left:535px;z-index:10}

/* Separator after last frozen column */
.gantt-wrapper td.sep-col{border-right:2px solid #91d5ff}
.gantt-wrapper th.sep-col{border-right:2px solid #91d5ff}

/* === ROW COLORS — phase-based row tinting === */
tr.phase-prep td{background:#f6ffed}
tr.phase-launch td{background:#fff7e6}
tr.phase-exec td{background:#e6f7ff}
tr.phase-review td{background:#f9f0ff}
tr.phase-milestone td{background:#fff0f6}

/* === FROZEN CELL BACKGROUNDS — explicit for position:sticky to render === */
.phase-label{font-weight:700;writing-mode:vertical-lr;letter-spacing:4px;font-size:13px;text-align:center;padding:8px 4px;min-height:60px}
tr.phase-prep td.phase-label{background:#d9f7be;color:#237804}
tr.phase-launch td.phase-label{background:#ffe58f;color:#ad6800}
tr.phase-exec td.phase-label{background:#91d5ff;color:#003a8c}
tr.phase-review td.phase-label{background:#d3adf7;color:#391063}
tr.phase-milestone td.phase-label{background:#ffadd2;color:#eb2f96}

/* Generic frozen cell explicit backgrounds */
tr.phase-prep td.cell,tr.phase-prep td.del-cell,tr.phase-prep td.ms-cell,tr.phase-prep td.col-status-data{background:#f6ffed}
tr.phase-launch td.cell,tr.phase-launch td.del-cell,tr.phase-launch td.ms-cell,tr.phase-launch td.col-status-data{background:#fff7e6}
tr.phase-exec td.cell,tr.phase-exec td.del-cell,tr.phase-exec td.ms-cell,tr.phase-exec td.col-status-data{background:#e6f7ff}
tr.phase-review td.cell,tr.phase-review td.del-cell,tr.phase-review td.ms-cell,tr.phase-review td.col-status-data{background:#f9f0ff}
tr.phase-milestone td.cell,tr.phase-milestone td.del-cell,tr.phase-milestone td.ms-cell,tr.phase-milestone td.col-status-data{background:#fff0f6}

/* Row hover effect on frozen cells */
tr:hover td.phase-label,tr:hover td.cell,tr:hover td.del-cell,tr:hover td.ms-cell,tr:hover td.col-status-data{filter:brightness(0.97)}

/* === CELL TYPES (frozen columns) === */
.cell{padding:5px;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.del-cell{cursor:default;padding:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;position:relative;text-align:center}
.del-cell:hover{background:#f0f0f0!important}
.ms-cell{text-align:center;padding:4px;cursor:pointer;font-size:15px;line-height:1}
.ms-check{text-align:center}
.col-status-data{text-align:center;padding:5px}

/* Status badges */
.status-badge{padding:1px 7px;border-radius:10px;font-size:11px;white-space:nowrap;display:inline-block}
.status-done{background:#d9f7be;color:#237804}
.status-progress{background:#fff7b3;color:#ad6800}
.status-pending{background:#f0f0f0;color:#999}

/* Column resize handles */
.resize-handle{position:absolute;right:0;top:0;bottom:0;width:4px;cursor:col-resize;z-index:50;transition:background .15s}
.resize-handle:hover,.resize-handle.active{background:#1890ff}

/* === TASK BARS (gantt chart area) === */
.gantt-cell{position:relative;height:32px;min-width:100%}
.task-bar{position:absolute;height:20px;border-radius:4px;top:5px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.1);transition:all .15s}
.task-bar:hover{filter:brightness(1.1);transform:translateY(-1px)}
.bar-milestone{background:linear-gradient(135deg,#eb2f96,#722ed1)!important;box-shadow:0 1px 4px rgba(235,47,150,.3);border:1px solid rgba(235,47,150,.3)}
.bar-milestone::before{content:"◆ ";font-size:9px}

/* Today line */
.today-line{position:absolute;top:0;bottom:0;width:2px;background:#ff4d4f;z-index:5;pointer-events:none}
.today-label{position:absolute;top:-24px;left:50%;transform:translateX(-50%);font-size:9px;color:#ff4d4f;white-space:nowrap}

/* Row actions (delete button) — embedded inside del-cell */
.row-actions{position:absolute;right:2px;top:2px;opacity:0;transition:opacity .2s;z-index:15}
.del-cell:hover .row-actions{opacity:1}
.row-actions button{background:none;border:none;cursor:pointer;font-size:13px;color:#ff4d4f;padding:2px;line-height:1;border-radius:3px}
.row-actions button:hover{background:#fff1f0}/* === ADMIN PANEL === */
.admin-section{background:#fff;border-radius:10px;box-shadow:0 2px 12px rgba(0,0,0,.06);padding:20px;margin-bottom:16px}
.admin-section h2{font-size:16px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.member-table{width:100%;border-collapse:collapse;font-size:13px}
.member-table th,.member-table td{padding:8px 12px;border:1px solid #e8e8e8;text-align:left}
.member-table th{background:#fafafa;font-weight:600;font-size:12px;color:#555}
.member-table select{padding:4px 8px;border:1px solid #d9d9d9;border-radius:4px;font-size:12px}
.invite-form{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.invite-form input,.invite-form select{padding:8px 12px;border:1px solid #d9d9d9;border-radius:6px;font-size:13px}
.invite-form input:focus,.invite-form select:focus{border-color:#1890ff;outline:none}
.invite-form button{padding:8px 16px;background:#1890ff;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:13px}
.invite-form button:hover{background:#40a9ff}

/* === MODAL === */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:1000;justify-content:center;align-items:center}
.modal-overlay.active{display:flex}
.modal{background:#fff;border-radius:12px;padding:24px;min-width:420px;max-width:500px;box-shadow:0 8px 32px rgba(0,0,0,.15);margin:20px;max-height:90vh;overflow-y:auto}
.modal h3{font-size:16px;margin-bottom:14px}
.modal label{display:block;font-size:12px;color:#666;font-weight:500;margin-bottom:3px}
.modal input,.modal select{width:100%;padding:7px 10px;border:1px solid #d9d9d9;border-radius:6px;font-size:13px;margin-bottom:10px;outline:none}
.modal input:focus,.modal select:focus{border-color:#1890ff;box-shadow:0 0 0 2px rgba(24,144,255,.1)}
.modal .row{display:flex;gap:10px}
.modal .row>div{flex:1}
.modal .cb-row{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.modal .cb-row input[type=checkbox]{width:auto;accent-color:#eb2f96;width:18px;height:18px;cursor:pointer;margin:0}
.modal .cb-row label{margin:0;cursor:pointer;font-size:14px;color:#eb2f96;font-weight:600}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
.modal-btns button{padding:7px 18px;border:none;border-radius:6px;cursor:pointer;font-size:13px}
.btn-ok{background:#1890ff;color:#fff}
.btn-ok:hover{background:#40a9ff}
.btn-cancel{background:#f0f0f0;color:#555}
.btn-cancel:hover{background:#d9d9d9}

/* === TOAST === */
.toast{position:fixed;top:16px;right:16px;z-index:2000;padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;transform:translateY(-10px);transition:all .3s;pointer-events:none;max-width:360px}
.toast.show{opacity:1;transform:translateY(0)}
.toast-info{background:#1890ff;color:#fff}
.toast-success{background:#52c41a;color:#fff}
.toast-error{background:#ff4d4f;color:#fff}

.file-input-hidden{display:none}
.file-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-top:12px}
.file-card{border:1px solid #e8e8e8;border-radius:10px;padding:14px;background:#fff;transition:box-shadow .2s;position:relative}
.file-card:hover{box-shadow:0 2px 12px rgba(0,0,0,.08)}
.file-card .icon{font-size:32px;text-align:center;margin-bottom:8px}
.file-card .fname{font-size:13px;font-weight:600;word-break:break-all;line-height:1.4;margin-bottom:4px}
.file-card .fmeta{font-size:11px;color:#999}
.file-card .factions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.file-card .factions button{padding:4px 10px;border:1px solid #d9d9d9;border-radius:4px;background:#fafafa;cursor:pointer;font-size:11px}
.file-card .factions button:hover{background:#e6f7ff;border-color:#1890ff}
.file-categories{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.file-categories button{padding:6px 14px;border:1px solid #d9d9d9;border-radius:20px;background:#fff;cursor:pointer;font-size:12px;transition:all .2s}
.file-categories button:hover{border-color:#1890ff;color:#1890ff}
.file-categories button.active{background:#1890ff;color:#fff;border-color:#1890ff}
.file-upload-area{border:2px dashed #d9d9d9;border-radius:10px;padding:30px;text-align:center;margin-bottom:16px;cursor:pointer;transition:all .2s}
.file-upload-area:hover{border-color:#1890ff;background:#f0f8ff}
.file-upload-area.dragover{border-color:#1890ff;background:#e6f7ff}
@media print{.tab-bar,.toolbar,.user-info button,.permission-notice,.ms-bar{display:none}}

/* Project Selector */
#projectSelector{padding:4px 8px;border:1px solid #d9d9d9;border-radius:6px;font-size:12px;max-width:200px;background:#fafafa;cursor:pointer}
#projectSelector:focus{border-color:#1890ff;outline:none}
#projectSelector option{padding:4px}
</style>
</head>
<body>
<!-- Loading -->
<div id="loadingScreen">
  <div class="spinner"></div>
  <p>加载中...</p>
</div>

<!-- Login -->
<div id="loginPage" class="login-page hide">
  <div class="login-card">
    <h1>🏗️ OGD 项目协作</h1>
    <p>使用密码登录（超级管理员）</p>
    <input type="email" id="loginEmail" placeholder="your@email.com" autocomplete="email"><input type="password" id="loginPassword" placeholder="密码" style="margin-top:8px">
    <button id="loginBtn" onclick="loginWithPassword()">登录</button><button class="tb-ghost" id="toggleLoginBtn" onclick="toggleLoginMode()" style="margin-top:4px;width:100%;font-size:12px">使用邮箱链接登录</button>
    <div id="loginMsg" class="login-msg"></div>
  </div>
</div>

<!-- App -->
<div id="appMain" class="hide">
  <div class="app-header">
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <h1>🏗️ 项目管理系统 <small>v2.0.0</small></h1>
      <select id="projectSelector" onchange="switchProject(this.value)" style="padding:4px 8px;border:1px solid #d9d9d9;border-radius:6px;font-size:12px;max-width:200px;background:#fafafa;cursor:pointer" title="切换项目">
        <option value="">加载中...</option>
      </select>
    </div>
    <div class="user-info">
      <span id="userName"></span>
      <span id="userBadge" class="user-badge"></span>
      <button onclick="showAdminPanel()" id="adminBtn" class="hide">⚙️ 管理</button>
      <button onclick="logout()">🚪 退出</button>
    </div>
  </div>

  <div class="tab-bar">
    <button class="active" onclick="switchTab('gantt')">📊 甘特图</button>
    <button id="adminTabBtn" class="hide" onclick="switchTab('admin')">⚙️ 团队管理</button>
    <button id="filesTabBtn" class="hide" onclick="switchTab('files')">📁 文件仓库</button>
  </div>

  <div id="tabGantt" class="page-content">
    <div id="permNotice" class="permission-notice"></div>
    <div id="msBar" class="ms-bar">
      <h3>◆ 里程碑 <span id="msCount" style="background:#eb2f96;color:#fff;border-radius:10px;padding:0 7px;font-size:11px;line-height:18px">0</span></h3>
      <div class="ms-timeline" id="msTimeline"></div>
    </div>
    <div class="toolbar">
      <button class="tb-success" id="addBtn" onclick="addTask()">➕ 新增</button>
      <button class="tb-ghost" onclick="toggleMsFilter()" id="msFilter">◆ 只看里程碑</button>
      <div class="tb-sep"></div>
      <button class="tb-ghost" onclick="refreshData()">🔄 刷新</button>
      <div class="legend">
        <span class="legend-item"><span class="lc" style="background:#52c41a"></span>准备</span>
        <span class="legend-item"><span class="lc" style="background:#faad14"></span>启动</span>
        <span class="legend-item"><span class="lc" style="background:#1890ff"></span>实施</span>
        <span class="legend-item"><span class="lc" style="background:#722ed1"></span>回顾</span>
        <span class="legend-item"><span class="lc" style="background:linear-gradient(135deg,#eb2f96,#722ed1)"></span>◆里程碑</span>
      </div>
    </div>
    <div class="gantt-wrapper">
      <table class="frozen-cols" id="ganttTable">
        <thead id="ganttHead"></thead>
        <tbody id="ganttBody" class=""></tbody>
      </table>
    </div>
  </div>

  <div id="tabAdmin" class="page-content hide">
    <div id="adminContent"></div>
  </div>
  <div id="tabFiles" class="page-content hide">
    <div id="filesContent"></div>
  </div>
</div>

<!-- Edit Modal -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <h3>✏️ 编辑任务</h3>
    <label>产出</label><input id="eDeliverable">
    <div class="row"><div><label>内容</label><input id="eContent"></div><div><label>公司</label><select id="eCompany"><option>嘉顿</option><option>ECS</option><option>嘉顿/ECS</option></select></div></div>
    <label>负责人</label><input id="eResponsible">
    <div class="row"><div><label>开始日期</label><input id="eStart" type="date"></div><div><label>结束日期</label><input id="eEnd" type="date"></div></div>
    <label>状态</label><select id="eStatus"><option value="完成">✅ 完成</option><option value="进行中">🔄 进行中</option><option value="">⏳ 待开始</option></select>
    <div class="cb-row"><input type="checkbox" id="eMilestone"><label for="eMilestone">◆ 标记为里程碑</label></div>
    <div class="modal-btns"><button class="btn-cancel" onclick="closeModal()">取消</button><button class="btn-ok" onclick="saveEdit()">保存</button></div>
  </div>
</div>

<!-- Add Member Modal -->
<div class="modal-overlay" id="memberModal">
  <div class="modal">
    <h3>👤 添加团队成员</h3>
    <label>邮箱</label><input id="mEmail" type="email" placeholder="colleague@company.com">
    <div class="row">
      <div><label>姓名</label><input id="mName" placeholder="显示名称"></div>
      <div><label>公司</label><select id="mCompany"><option value="ECS">ECS</option><option value="嘉顿">嘉顿</option></select></div>
    </div>
    <label>角色</label><select id="mRole"><option value="member">成员</option><option value="admin">公司管理员</option></select>

function loadColWidths() {
  try {
    const s = localStorage.getItem('ogd_col_widths');
    if (s) { const w = JSON.parse(s); COL_DEFS.forEach(c => { if (w[c.id]) c.width = w[c.id]; }); }
  } catch(e) {}
}
function saveColWidths() {
  const o = {}; COL_DEFS.forEach(c => o[c.id]=c.width);
  try { localStorage.setItem('ogd_col_widths', JSON.stringify(o)); } catch(e) {}
}

function applyColStyles() {
  let left = 0;
  COL_DEFS.forEach(c => { c._left = left; left += c.width; });

  let css = '';
  COL_DEFS.forEach((c, i) => {
    const w = c.width, l = c._left;
    // Column widths
    css += `.col-${c.id}{width:${w}px;min-width:${w}px;max-width:${w}px;text-align:${c.id==='milestone'?'center':'left'}}`;
    // Header: sticky top + sticky left
    css += `#ganttTable .col-${c.id}{position:sticky;top:0;left:${l}px;z-index:31;}`;
    // Body frozen cells: sticky left via fixed-* class
    css += `#ganttTable td.fixed-${c.id}{position:sticky;left:${l}px;z-index:10;background:#fff}`;
  });
  // Separator
  css += 'td.sep-col{border-right:2px solid #91d5ff}th.sep-col{border-right:2px solid #91d5ff}';

  let el = document.getElementById('colDynStyles');
  if (!el) { el = document.createElement('style'); el.id = 'colDynStyles'; document.head.appendChild(el); }
  el.textContent = css;
}

function initResizeHandles() {
  document.querySelectorAll('.resize-handle').forEach(h => {
    h.removeEventListener('mousedown', h._rd);
    h._rd = function(e) {
      e.preventDefault(); e.stopPropagation();
      const colId = this.dataset.col;
      const colIdx = COL_DEFS.findIndex(c=>c.id===colId);
      if(colIdx<0) return;
      const col = COL_DEFS[colIdx];
      const startX = e.clientX, startW = col.width;
      this.classList.add('active');
      document.body.style.cursor = 'col-resize';
      document.body.style.userSelect = 'none';

      function onMove(ev) {
        const dx = ev.clientX - startX;
        const newW = Math.max(col.minW, startW + dx);
        col.width = newW;
        applyColStyles();
      }
      function onUp() {
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        h.classList.remove('active');
        document.body.style.cursor = '';
        document.body.style.userSelect = '';
        saveColWidths();
      }
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    };
    h.addEventListener('mousedown', h._rd);
  });
}

async function loadProfile(user) {
  // Try to load existing profile
  let { data, error } = await sb.from('profiles').select('*').eq('id', user.id).maybeSingle();
  // If no profile exists, auto-create one for new users
  if (!data && !error) {
    const userMeta = user.user_metadata || {};
    const defaultName = userMeta.name || user.email?.split('@')[0] || 'New User';
    const defaultCompany = userMeta.company || 'ECS';
    const { data: newProfile, error: createErr } = await sb.from('profiles').insert({
      id: user.id,
      email: user.email,
      name: defaultName,
      company: defaultCompany,
      role: 'member'
    }).select().single();
    if (!createErr) { data = newProfile; }
  }
  if (data) {
    // Check if user is inactive
    // If status column doesn't exist yet, this check safely passes
    if (data.status === 'inactive') {
      await sb.auth.signOut();
      showLoginMsg('❌ 你的账号已被管理员停用，请联系管理员','error');
      document.getElementById('loadingScreen').classList.add('hide');
      document.getElementById('loginPage').classList.remove('hide');
      return;

    // Set status to active on successful login (safe if column doesn't exist)
    if (data.status && data.status !== 'active') {
      try { await sb.from('profiles').update({status:'active'}).eq('id', user.id); } catch(e) {}
      data.status = 'active';

// GANTT RENDER
// ============================================================
function renderGantt() {
  applyColStyles();
  const data = msOnly ? tasks.filter(t=>t.milestone) : tasks;
  if (!data.length) {
    document.getElementById('ganttBody').innerHTML = '<tr><td colspan="20" style="text-align:center;padding:40px;color:#999">暂无任务</td></tr>';
    renderMsOverview();
    updatePermNotice();
    return;
  }
  
  // Timeline
  let mn=null,mx=null;
  data.forEach(t=>{
    if(t.start_date&&(!mn||new Date(t.start_date)<mn)) mn=new Date(t.start_date);
    if(t.end_date&&(!mx||new Date(t.end_date)>mx)) mx=new Date(t.end_date);
  });
  if(!mn) mn=new Date("2026-06-01"); if(!mx) mx=new Date("2026-08-20");
  mn.setDate(mn.getDate()-3); mx.setDate(mx.getDate()+7);
  const td = Math.round((mx-mn)/86400000);

  // Month headers
  let cur = new Date(mn);
  let mgs=[],cm=null;
  for(let i=0;i<=td;i++){const m=cur.getMonth();if(m!==cm){cm=m;mgs.push({month:m,year:cur.getFullYear(),startIdx:i,label:`${cur.getFullYear()}/${String(m+1).padStart(2,'0')}`});}cur.setDate(cur.getDate()+1);}

  // === Build header row 1 (months) ===
  let fc = COL_DEFS.map(c=>`<th class="col-${c.id}">${c.label}<div class="resize-handle" data-col="${c.id}" title="拖拽调整宽度"></div></th>`).join('');
  let h = `<tr class="date-header">${fc}<th colspan="${td+1}" class="sep-col" style="padding:0;border-left:2px solid #91d5ff"><div style="display:flex">`;
  mgs.forEach((mg,i)=>{const sp=(i<mgs.length-1?mgs[i+1].startIdx:td+1)-mg.startIdx;h+=`<div style="flex:${sp};text-align:center;padding:4px 0;font-weight:700;color:#1890ff;font-size:12px;border-right:1px solid #e6f0ff">${mg.label}</div>`;});
  h+=`</div></th></tr>`;

  // === Build header row 2 (days) ===
  h+=`<tr class="date-header"><th colspan="7" class="sep-col" style="position:sticky;left:0;z-index:29;background:#fafafa;border-right:2px solid #91d5ff"></th>`;
  cur=new Date(mn);
  for(let i=0;i<=td;i++){
    const day=cur.getDay(),we=day===0||day===6;
    const it=new Date().toDateString()===cur.toDateString();
    h+=`<th style="${we?'color:#bbb':''}${it?'background:#fff1f0;color:#ff4d4f;font-weight:700':''}width:${CELL_W}px;min-width:${CELL_W}px;padding:3px 0;font-size:10px">${cur.getDate()}</th>`;
    cur.setDate(cur.getDate()+1);
  }
  h+='</tr>';
  document.getElementById('ganttHead').innerHTML = h;

  // === Body ===
  const barColors={"准备阶段":"#52c41a","项目实施":"#faad14","实施阶段":"#1890ff","回顾阶段":"#722ed1"};
  let grp={};
  data.forEach(t=>{if(!grp[t.phase])grp[t.phase]=[];grp[t.phase].push(t);});
  let pns=Object.keys(grp).sort((a,b)=>PHASE_ORDER.indexOf(a)-PHASE_ORDER.indexOf(b));
  let b='';
  
  pns.forEach(pn=>{
    const items=grp[pn], pc=pn.replace('阶段','').trim()||pn;
    const pClass=pn==='准备阶段'?'prep':(pn==='项目实施'?'launch':(pn==='实施阶段'?'exec':'review'));
    items.forEach((t,i)=>{
      const isMs=t.milestone, sc=t.status||'';
      const s=t.start_date?new Date(t.start_date):null, e=t.end_date?new Date(t.end_date):null;
      const bc=isMs?'linear-gradient(135deg,#eb2f96,#722ed1)':(sc==='完成'?'#52c41a':(sc==='进行中'?'#faad14':(barColors[t.phase]||'#bfbfbf')));
      const canE=canEdit(t.company);
      const showDel = canDelete();
      
      b+=`<tr class="phase-${pClass}${isMs?' phase-milestone':''}">`;
      if(i===0) b+=`<td class="phase-label col-phase fixed-phase" rowspan="${items.length}">${pn.replace('阶段','')}</td>`;
      b+=`<td class="cell col-content fixed-content" ${canE?`ondblclick="editTask(${t.id})"`:""} title="${canE?"双击编辑":""}">${t.content}</td>`;
      b+=`<td class="del-cell col-deliverable fixed-deliverable" ${canE?`ondblclick="editTask(${t.id})"`:''} title="${canE?'双击编辑':''}">${isMs?'◆ ':''}${t.deliverable}${showDel?`<div class="row-actions"><button onclick="deleteTask(${t.id})" title="删除">🗑️</button></div>`:''}</td>`;
      b+=`<td class="cell col-company fixed-company" ${canE?`ondblclick="editTask(${t.id})"`:""} title="${canE?"双击编辑":""}" style="text-align:center">${t.company||""}</td>`;
      b+=`<td class="cell col-responsible fixed-responsible" ${canE?`ondblclick="editTask(${t.id})"`:""} title="${canE?"双击编辑":""}" style="text-align:center">${t.responsible||""}</td>`;
      b+=`<td class="col-status-data fixed-status" ${canE?`ondblclick="editTask(${t.id})"`:""} title="${canE?"双击编辑":""}"><span class="status-badge status-${sc==="完成"?"done":(sc==="进行中"?"progress":"pending")}">${sc||"待开始"}</span></td>`;
      b+=`<td class="ms-check fixed-milestone" ${canE?`onclick="toggleMs(${t.id})"`:''} title="${canE?'点击切换里程碑':''}">${isMs?'◆':'◇'}</td>`;

      // Gantt chart cell
      b+=`<td class="sep-col" colspan="${td+1}" style="padding:0;border-left:2px solid #91d5ff;position:relative;height:32px"><div class="gantt-cell">`;
      
      // Today line
      const to=Math.round((new Date()-mn)/86400000);
      if(to>=0&&to<=td) b+=`<div class="today-line" style="left:${to*CELL_W+CELL_W/2}px"><span class="today-label">今天</span></div>`;

      if(s&&e){
        const so=Math.round((s-mn)/86400000), eo=Math.round((e-mn)/86400000);
        const bw=Math.max((eo-so+1)*CELL_W-4,8), bl=so*CELL_W+2, lbl=t.deliverable.length>6?t.deliverable.slice(0,6)+'..':t.deliverable;
        b+=`<div class="task-bar ${isMs?'bar-milestone':'bar-'+(sc==='完成'?'ready':(sc==='进行中'?'active':'wait'))}" style="left:${bl}px;width:${bw}px;background:${bc}" ${canE?`ondblclick="editTask(${t.id})"`:''} title="${isMs?'◆里程碑: ':''}${t.deliverable}
${t.start_date||'?'}→${t.end_date||'?'}
${t.responsible?'负责人:'+t.responsible:''}
状态:${sc||'待开始'}">${bw>50?lbl:''}</div>`;
      } else if(!s&&e){
        const eo=Math.round((e-mn)/86400000);
        b+=`<div class="task-bar" style="left:${eo*CELL_W+12}px;width:12px;background:#bbb" title="${t.deliverable}
截止:${t.end_date}"></div>`;
      } else if(!s&&!e&&(t.phase==="实施阶段"||t.phase==="回顾阶段")){
        const ro=Math.round((new Date("2026-07-10")-mn)/86400000), re=td;
        const bw=Math.max((re-ro+1)*CELL_W-4,8), bl=ro*CELL_W+2;
        b+=`<div class="task-bar" style="left:${bl}px;width:${bw}px;background:${bc};opacity:.4;border:1px dashed ${bc}" title="${t.deliverable}
（持续进行中）"></div>`;
      }
      b+='</div></td></tr>';
    });
  });
  document.getElementById('ganttBody').innerHTML = b;
  renderMsOverview();
  updatePermNotice();
  // Re-bind resize handles after DOM update
  setTimeout(initResizeHandles, 0);
}

function renderMsOverview() {
  const ms = tasks.filter(t=>t.milestone);
  document.getElementById('msCount').textContent = ms.length;
  ms.sort((a,b)=>(a.end_date||a.start_date||'')>(b.end_date||b.start_date||'')?1:-1);
  let html='';
  ms.forEach((t,i)=>{
    const done=t.status==='完成', d=t.end_date||t.start_date||'';
    const ds=d?new Date(d).getMonth()+1+'/'+new Date(d).getDate():'';
    html+=`<div class="ms-item" onclick="scrollToTask('${t.deliverable.replace(/'/g,"\\'")}')" title="点击跳转">
      <div class="ms-diamond" style="color:${done?'#52c41a':'#eb2f96'}">${done?'✅':'◆'}</div>

}

function scrollToTask(del) {

      c.closest('tr').scrollIntoView({behavior:'smooth',block:'center'});
      c.style.background='#fff0f6';setTimeout(()=>c.style.background='',2000);

}

async function addTask() {
  if (!currentUser) return showToast('⛔ 请先登录','error');
  if (!canEdit('嘉顿')&&!canEdit('ECS')) return showToast('⛔ 你没有权限添加任务','error');
  try {
    const company = currentUser.company || 'ECS';
    if (!currentProject) return showToast('⛔ 请先选择项目','error');
  const { data, error } = await sb.from('tasks').insert({
      project_id: currentProject.id, phase:'准备阶段', content:'新任务', deliverable:'双击编辑', company:company,
      responsible:'', status:'', milestone:false
    }).select().single();
    if(error) return showToast('❌ 添加失败: '+error.message,'error');
    if(!data) return showToast('❌ 添加失败: 未返回数据','error');
    tasks.push(data);
    renderGantt();
    setTimeout(()=>{
      const wrapper=document.querySelector('.gantt-wrapper');
      if(wrapper) wrapper.scrollTop=wrapper.scrollHeight;
    },100);
    showToast('➕ 已添加，双击编辑','success');
  } catch(e) {
    showToast('❌ 添加失败: '+e.message,'error');
  }
}

async function deleteTask(id) {
  if(!canDelete()) return showToast('⛔ 只有管理员可以删除','error');
  const t=tasks.find(t=>t.id===id);
  if(!confirm(`删除「${t?t.deliverable:''}」？`)) return;
  const { error } = await sb.from('tasks').delete().eq('id',id);
  if(error) return showToast('❌ 删除失败','error');
  tasks=tasks.filter(t=>t.id!==id);
  renderGantt();
  showToast('🗑️ 已删除','info');
}

async function toggleMs(id) {
  const t=tasks.find(t=>t.id===id);
  if(!t||!canEdit(t.company)) return showToast('⛔ 你没有权限','error');
  const { error } = await sb.from('tasks').update({milestone:!t.milestone}).eq('id',id);
  if(!error){t.milestone=!t.milestone;renderGantt();showToast(t.milestone?'◆ 标记里程碑':'◇ 取消里程碑','info');}
}

function editTask(id) {
  const t=tasks.find(t=>t.id===id);
  if(!t) return;
  if(!canEdit(t.company)) return showToast('⛔ 你只能编辑自己公司的任务','error');
  editIdx = id;
  document.getElementById('eDeliverable').value=t.deliverable;
  document.getElementById('eContent').value=t.content;
  document.getElementById('eCompany').value=t.company||'嘉顿';
  document.getElementById('eResponsible').value=t.responsible||'';
  document.getElementById('eStart').value=t.start_date||'';
  document.getElementById('eEnd').value=t.end_date||'';
  document.getElementById('eStatus').value=t.status||'';
  document.getElementById('eMilestone').checked=!!t.milestone;
  document.getElementById('editModal').classList.add('active');
}

async function saveEdit() {
  if(editIdx<0) return;
  const updates={
    deliverable:document.getElementById('eDeliverable').value,
    content:document.getElementById('eContent').value,
    company:document.getElementById('eCompany').value,
    responsible:document.getElementById('eResponsible').value,
    start_date:document.getElementById('eStart').value||null,
    end_date:document.getElementById('eEnd').value||null,
    status:document.getElementById('eStatus').value,
    milestone:document.getElementById('eMilestone').checked
  };
  const { error } = await sb.from('tasks').update(updates).eq('id',editIdx);
  if(error) return showToast('❌ 保存失败: '+error.message,'error');
  const t=tasks.find(t=>t.id===editIdx);
  if(t) Object.assign(t,updates);
  closeModal();
  renderGantt();
  showToast('✅ 已保存','success');
}

function closeModal() { document.getElementById('editModal').classList.remove('active'); editIdx=-1; }

let files = [];
let activeFileCategory = '';
let sbStorage = null;
let _storageReady = false;

function initStorage() {
  return true;
}

// Get user JWT from Supabase SDK session
async function getAccessToken() {
  // Method 1: SDK getSession (primary)
  try {
    const { data: { session } } = await sb.auth.getSession();
    if (session?.access_token) return session.access_token;
  } catch(e) {
    console.warn('[Token] SDK getSession failed:', e.message);
  }
  
  // Method 2: localStorage fallback (bypasses SDK)
  // Supabase stores session in localStorage as sb-<ref>-auth-token
  try {
    const projectRef = SUPABASE_URL.replace('https://', '').split('.')[0];
    const key = 'sb-' + projectRef + '-auth-token';
    const raw = localStorage.getItem(key);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed?.access_token) {
        console.log('[Token] Got token from localStorage');
        return parsed.access_token;
      }
    }
  } catch(e) {
    console.warn('[Token] localStorage fallback failed:', e.message);
  }
  
  console.warn('[Token] No token available');
  return null;
}

// Generic Supabase Storage REST API call using user's JWT
async function storageAPI(method, path, body) {
  const token = await getAccessToken();
  if (!token) throw new Error('UNAUTHORIZED: No auth token');
  
  // URL-encode for non-ASCII characters in filenames
  const url = encodeURI(SUPABASE_URL + '/storage/v1/' + path);
  const options = { method, headers: { 'Authorization': 'Bearer ' + token, 'apikey': SUPABASE_ANON_KEY } };
  if (body) options.body = body;
  
  console.log('[StorageAPI]', method, url);
  const resp = await fetch(url, options);
  if (!resp.ok) {
    const text = await resp.text();
    console.error('[StorageAPI Error]', resp.status, text);
    // Classify the error for better user messaging
    const err = new Error(text || 'HTTP ' + resp.status);
    err.status = resp.status;
    if (text.includes('policy') || text.includes('permission') || text.includes('violates') || resp.status === 401 || resp.status === 403) {
      err.code = 'PERMISSION_DENIED';
    } else if (text.includes('bucket') || text.includes('not found') || resp.status === 404) {
      err.code = 'BUCKET_NOT_FOUND';
    } else if (resp.status === 409) {
      err.code = 'CONFLICT';
    }
    throw err;
  }
  return resp;
}

// Check if the storage bucket exists (raw fetch, no SDK)
async function ensureBucketExists() {
  // Check bucket by trying to list objects (more reliable than listing all buckets)
  try {
    const resp = await storageAPI('GET', 'object/list/project_files');
    if (resp.ok || resp.status === 200 || resp.status === 206 || resp.status === 404) {
      // 200/206 = bucket exists with/without results
      // 404 = bucket exists but path not found (the bucket itself is valid)
      return true;
    }
  } catch(e) {
    // If the error is about missing bucket, the catch will help diagnose
    if (e.status === 404 && e.code === 'BUCKET_NOT_FOUND') {
      console.warn('[BucketCheck] Bucket not found via REST');
      return false;
    }
  }
  // Fallback: try listing buckets (may fail for non-admin JWT)
  try {
    const resp = await storageAPI('GET', 'bucket');
    const buckets = await resp.json();
    const exists = buckets && buckets.some(b => b.name === 'project_files' || b.id === 'project_files');
    console.log('[BucketCheck] project_files bucket ' + (exists ? 'EXISTS' : 'NOT FOUND'));
    return exists;
  } catch(e) {
    console.warn('[BucketCheck] Assuming bucket exists (upload test will confirm)');
    return true;
  }
}

// Upload file directly via raw fetch (PRIMARY method)
async function uploadFileDirect(path, file) {
  const formData = new FormData();
  formData.append('file', file);
  // Do NOT set Content-Type - let browser set multipart/form-data boundary
  const resp = await storageAPI('POST', 'object/project_files/' + path, formData);
  console.log('[Upload] Success:', path);
  return resp;
}

// Download file via raw fetch
async function downloadFileDirect(path) {
  const resp = await storageAPI('GET', 'object/project_files/' + path);
  const blob = await resp.blob();
  return blob;
}

// Delete file via raw fetch
async function deleteFileDirect(path) {
  await storageAPI('DELETE', 'object/project_files/' + path);
  console.log('[Delete] Success:', path);
}

// Main download function (called from onclick handlers in renderFiles)
async function downloadFile(id, originalName, storagePath) {
  try {
    console.log('[Download] Starting:', originalName, 'path:', storagePath);
    const token = await getAccessToken();
    if (!token) return showToast('❌ 无法获取登录令牌','error');
    
    const resp = await fetch(encodeURI(SUPABASE_URL + '/storage/v1/object/project_files/' + storagePath), {
      headers: { 'Authorization': 'Bearer ' + token, 'apikey': SUPABASE_ANON_KEY }
    });
    
    if (!resp.ok) {
      const errText = await resp.text();
      if (resp.status === 401 || resp.status === 403) return showToast('❌ 下载权限不足','error');
      if (resp.status === 404) return showToast('❌ 文件在存储中未找到','error');
      throw new Error('HTTP ' + resp.status + ': ' + errText.substring(0, 100));
    }
    
    const blob = await resp.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = originalName || 'download'; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    try { await logAction('下载文件', originalName); } catch(e) {}
  } catch(e) {
    console.error('[Download] Error:', e);
    showToast('❌ 下载失败: ' + (e.message || String(e)).substring(0, 100),'error');
  }
}

// Main delete function (called from onclick handlers in renderFiles)
async function deleteFile(id) {
  if (!confirm('确定要删除这个文件吗？')) return;
  try {
    const f = files.find(x => x.id === id);
    if (!f) return showToast('❌ 文件不存在','error');
    console.log('[Delete] Deleting:', f.original_name, 'path:', f.storage_path);
    
    const token = await getAccessToken();
    if (!token) return showToast('❌ 无法获取登录令牌','error');
    
    const delResp = await fetch(encodeURI(SUPABASE_URL + '/storage/v1/object/project_files/' + f.storage_path), {
      method: 'DELETE',
      headers: { 'Authorization': 'Bearer ' + token, 'apikey': SUPABASE_ANON_KEY }
    });
    
    if (!delResp.ok) {
      const errText = await delResp.text();
      if (delResp.status === 401 || delResp.status === 403 || errText.includes('policy')) {
        return showToast('❌ 删除权限不足：仅管理员可删除文件','error');
      }
      throw new Error('HTTP ' + delResp.status + ': ' + errText.substring(0, 100));
    }
    
    const { error: metaErr } = await sb.from('file_metadata').delete().eq('id', id);
    if (metaErr) throw metaErr;
    
    showToast('✅ 已删除','success');
    try { await logAction('删除文件', f.original_name); } catch(e) {}
    renderFiles();
  } catch(e) {
    console.error('[Delete] Error:', e);
    showToast('❌ 删除失败: ' + (e.message || String(e)).substring(0, 100),'error');
  }
}

// Show an error toast with a detailed message
function showStorageError(err, context) {
  console.error('[' + context + ' Error]', err);
  let msg = '';
  if (err.code === 'PERMISSION_DENIED' || err.status === 401 || err.status === 403) {
    if (context === 'Upload' || context === 'upload') {
      msg = '❌ 权限不足：请确保：\n1. 你已在Supabase运行了 init_database.sql\n2. 你的账号已登录\n3. 如仍不行，请联系管理员检查你的角色';
    } else {
      msg = '❌ 操作权限不足';
    }
  } else if (err.code === 'BUCKET_NOT_FOUND' || err.status === 404) {
    msg = '❌ 存储桶未找到：请在 Supabase SQL Editor 运行 init_database.sql';
  } else if (err.status === 409) {
    msg = '❌ 文件已存在';
  } else {
    msg = '❌ ' + context + '失败: ' + (err.message || String(err)).substring(0, 200);
  }
  showToast(msg, 'error');
}

// Run a full diagnostic test of the storage system
async function testStorageSystem() {
  console.log('=== STORAGE DIAGNOSTIC START ===');
  const results = [];
  
  // Test 1: Check token
  try {
    const token = await getAccessToken();
    results.push({ step: '获取登录令牌', ok: !!token, detail: token ? '成功 (' + token.substring(0, 20) + '...)' : '无令牌' });
  } catch(e) { results.push({ step: '获取登录令牌', ok: false, detail: e.message }); }
  
  // Test 2: Check bucket by trying to list objects (more reliable)
  let bucketOk = false;
  try {
    const resp = await storageAPI('GET', 'object/list/project_files');
    bucketOk = resp.ok || resp.status === 200 || resp.status === 206;
    results.push({ step: '检查 project_files 存储桶', ok: bucketOk, detail: bucketOk ? '✅ 存储桶存在并可访问' : '⚠️ 可能不存在' });
    if (!bucketOk) {
      // Fallback: try listing buckets
      try {
        const resp2 = await storageAPI('GET', 'bucket');
        const buckets = await resp2.json();
        const has = buckets && buckets.some(b => b.name === 'project_files');
        bucketOk = has;
        results.push({ step: '→ 查询存储桶列表', ok: has, detail: has ? '✅ 确认存在' : '❌ 未找到 project_files' });
        if (!has) results.push({ step: '→ 需创建存储桶', ok: false, detail: '请在 Supabase SQL Editor 运行 v2_migration.sql' });
      } catch(e2) {
        results.push({ step: '→ 查询存储桶列表', ok: true, detail: '跳过（需管理员权限）' });
        bucketOk = true; // Assume exists if admin listing fails
      }
    }
  } catch(e) {
    results.push({ step: '检查 project_files 存储桶', ok: false, detail: e.message });
    if (e.code === 'PERMISSION_DENIED') {
      results.push({ step: '→ 可能权限不足', ok: false, detail: '需检查存储桶 RLS 策略' });
    }
  }
  
  // Test 3: Check file_metadata table
  try {
    const { data, error } = await sb.from('file_metadata').select('id').limit(1);
    results.push({ step: '访问 file_metadata 表', ok: !error, detail: error ? error.message : '✅ 可正常访问' });
  } catch(e) { results.push({ step: '访问 file_metadata 表', ok: false, detail: e.message }); }
  
  // Test 4: Check profiles table
  try {
    const { data, error } = await sb.from('profiles').select('id,role').eq('id', (await sb.auth.getSession()).data.session?.user?.id).single();
    if (data) {
      results.push({ step: '当前用户角色', ok: true, detail: data.role + ' - ' + (['super_admin','admin'].includes(data.role) ? '✅ 可上传文件' : '⚠️ 需管理员提升权限才能上传') });
    } else {
      results.push({ step: '当前用户角色', ok: false, detail: error ? error.message : '无 profile 记录' });
    }
  } catch(e) { results.push({ step: '当前用户角色', ok: false, detail: e.message }); }
  
  // Test 5: Upload a tiny test file
  if (results.some(r => r.ok && r.step === '查询存储桶列表')) {
    try {
      const testBlob = new Blob(['diagnostic_test'], { type: 'text/plain' });
      const testFile = new File([testBlob], '_diag_test.txt', { type: 'text/plain' });
      const testPath = '_diag/' + Date.now() + '_test.txt';
      await uploadFileDirect(testPath, testFile);
      results.push({ step: '上传测试文件 (1KB)', ok: true, detail: '✅ 上传成功!' });
      // Clean up test file
      try { await deleteFileDirect(testPath); } catch(e) {}
    } catch(e) {
      results.push({ step: '上传测试文件 (1KB)', ok: false, detail: e.message });
    }
  }
  
  console.log('=== STORAGE DIAGNOSTIC END ===');
  
  // Build result HTML
  let html = '<div style="background:#f6f8fa;border:1px solid #d0d7de;border-radius:8px;padding:16px;margin:12px 0;font-size:13px;line-height:1.8">';
  html += '<h3 style="margin-bottom:10px">🔍 存储系统诊断报告</h3>';
  let allOk = true;
  results.forEach(r => {
    const icon = r.ok ? '✅' : '❌';
    if (!r.ok) allOk = false;
    html += '<div>' + icon + ' <strong>' + r.step + '</strong>: ' + r.detail + '</div>';
  });
  html += '<div style="margin-top:10px;padding-top:10px;border-top:1px solid #d0d7de;font-weight:bold">';
  html += allOk ? '✅ 所有检测通过！可以正常上传文件' : '❌ 存在 ' + results.filter(r => !r.ok).length + ' 个问题，请根据提示修复';
  html += '</div></div>';
  
  // Show in a modal
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:9999;display:flex;justify-content:center;align-items:center';
  overlay.onclick = function(e) { if(e.target===this) this.remove(); };
  const box = document.createElement('div');
  box.style.cssText = 'background:#fff;border-radius:12px;padding:24px;max-width:600px;max-height:80vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.15);margin:20px';
  box.innerHTML = html + '<div style="text-align:right;margin-top:12px"><button onclick="this.closest(\'div[style*\').parentElement.remove()" style="padding:8px 20px;border:none;border-radius:6px;background:#1890ff;color:#fff;cursor:pointer">关闭</button></div>';
  overlay.appendChild(box);
  document.body.appendChild(overlay);
}

async function renderFiles() {
  initStorage();
  const isManager = currentUser && (currentUser.role === 'super_admin' || currentUser.role === 'admin');
  const categories = ['全部', '项目立项文件', '执行标准', '会议纪要', '周期性报告', '其他'];
  const catIcons = {'项目立项文件':'📋','执行标准':'📐','会议纪要':'📝','周期性报告':'📊','其他':'📁'};

  try {
    const { data: fileData } = await sb.from('file_metadata').select('*, uploaded_by_profile:profiles!uploaded_by(name)').eq('project_id', currentProject ? currentProject.id : 0).order('uploaded_at', { ascending: false });
    files = fileData || [];
  } catch(e) { 
    console.warn('[Files] Load error:', e);
    files = []; 
  }

  let html = '<h2 style="margin-bottom:8px;display:flex;align-items:center;gap:8px">📁 文件仓库</h2>';

  if (isManager) {
    html += '<div class="file-upload-area" id="uploadArea" onclick="document.getElementById(\'fileInput\').click()" ondragover="this.classList.add(\'dragover\');event.preventDefault()" ondragleave="this.classList.remove(\'dragover\')" ondrop="handleDrop(event)">' +
      '<div style="font-size:40px;margin-bottom:8px">📤</div>' +
      '<div style="font-weight:600;color:#333">点击上传或拖拽文件到此处</div>' +
      '<div style="font-size:12px;color:#999;margin-top:4px">支持所有文件格式，单文件最大50MB</div>' +
      '<input type="file" id="fileInput" style="display:none" onchange="uploadFile(this.files[0])">' +
    '</div>';
  }

  html += '<div style="margin-bottom:10px;display:flex;gap:8px;align-items:center">';
  html += '<div class="file-categories" style="flex:1;margin-bottom:0">';
  categories.forEach(c => {
    const count = c === '全部' ? files.length : files.filter(f => f.category === c).length;
    const catVal = c === '全部' ? '' : c;
    html += `<button class="${activeFileCategory === c || (c==='全部' && !activeFileCategory)?'active':''}" onclick="activeFileCategory='${catVal}';renderFiles()">${catIcons[c]||'📁'} ${c} (${count})</button>`;
  });
  html += '</div>';
  // Add diagnostic button
  html += '<button onclick="testStorageSystem()" style="white-space:nowrap;padding:6px 14px;border:1px solid #d9d9d9;border-radius:20px;background:#fff;cursor:pointer;font-size:12px;display:flex;align-items:center;gap:4px">🔍 诊断</button>';
  html += '</div>';

  const filtered = activeFileCategory ? files.filter(f => f.category === activeFileCategory) : files;
  if (!filtered.length) {
    html += '<div style="text-align:center;padding:40px;color:#999">暂无文件</div>';
  } else {
    html += '<div class="file-grid">';
    filtered.forEach(f => {
      const ext = (f.original_name||'').split('.').pop().toLowerCase();
      const icon = ext==='pdf'?'📄':(ext==='doc'||ext==='docx'?'📃':(ext==='xls'||ext==='xlsx'?'📊':(ext==='jpg'||ext==='png'||ext==='gif'?'🖼️':(ext==='ppt'||ext==='pptx'?'📽️':'📁'))));
      const size = f.file_size > 1024*1024 ? (f.file_size/1024/1024).toFixed(1)+' MB' : (f.file_size/1024).toFixed(1)+' KB';
      const uploader = f.uploaded_by_profile?.name || '未知';
      const date = new Date(f.uploaded_at).toLocaleDateString('zh-CN');
      const safeName = (f.original_name||'').replace(/'/g,'%27').replace(/"/g,'&quot;');
      const safePath = (f.storage_path||'').replace(/'/g,'%27').replace(/"/g,'&quot;');
      html += '<div class="file-card">' +
        '<div class="icon">'+icon+'</div>' +
        '<div class="fname" title="'+(f.original_name||'')+'">'+(f.original_name||'')+'</div>' +
        '<div class="fmeta">'+size+' · '+uploader+' · '+date+'</div>' +
        '<div class="factions">' +
          `<button onclick="downloadFile(${f.id},'${safeName}','${safePath}')">⬇️ 下载</button>` +
          (isManager ? `<button onclick="deleteFile(${f.id})" style="color:#ff4d4f">🗑️ 删除</button>` : '') +
        '</div>' +
      '</div>';
    });
    html += '</div>';
  }

  document.getElementById('filesContent').innerHTML = html;
}

function handleDrop(e) {
  e.preventDefault();
  const area = document.getElementById('uploadArea');
  if (area) area.classList.remove('dragover');
  if (e.dataTransfer.files.length) uploadFile(e.dataTransfer.files[0]);
}

let _pendingUploadFile = null;

async function uploadFile(file) {
  if (!file) return;
  _pendingUploadFile = file;
  document.getElementById('fileCatModal').classList.add('active');
}

async function doUploadWithCategory(cat) {
  const file = _pendingUploadFile;
  _pendingUploadFile = null;
  if (!file || !cat) return;
  if (file.size > 50 * 1024 * 1024) {
    return showToast('❌ 文件超过50MB限制','error');
  }
  if (!currentUser) return showToast('❌ 用户未登录','error');

  const folderMap = {'项目立项文件':'project_docs','执行标准':'standards','会议纪要':'meeting_minutes','周期性报告':'periodic_reports','其他':'other'};
  // Remove special chars (Supabase Storage doesn't accept Chinese in keys)
  const safeName = file.name.replace(/[^a-zA-Z0-9.\-_]/g, '_').replace(/_+/g, '_').substring(0, 100);
  const path = (folderMap[cat]||'other') + '/' + Date.now() + '_' + safeName;
  
  // Show an inline error panel for detailed diagnostics
  showToast('⏳ 上传中 (尝试3种方式)...','info');
  
  // Collect all errors
  const errors = [];
  
  // =========== STRATEGY 1: SDK upload ===========
  try {
    console.log('[Upload] Strategy 1: SDK upload');
    const { error: sdkErr } = await sb.storage.from('project_files').upload(path, file, { 
      upsert: false, 
      contentType: file.type || 'application/octet-stream' 
    });
    if (!sdkErr) {
      console.log('[Upload] Strategy 1 SUCCESS');
      // Record metadata
      await _recordMetadata(path, file, cat);
      return;
    }
    console.warn('[Upload] Strategy 1 failed:', sdkErr.message);
    errors.push('SDK方式: ' + sdkErr.message);
  } catch(e) {
    console.warn('[Upload] Strategy 1 exception:', e.message);
    errors.push('SDK方式异常: ' + e.message);
  }
  
  // =========== STRATEGY 2: Raw fetch with FormData ===========
  try {
    console.log('[Upload] Strategy 2: raw fetch + FormData');
    const token = await getAccessToken();
    if (!token) { errors.push('无法获取JWT令牌'); throw new Error('No token'); }
    
    const formData = new FormData();
    formData.append('file', file);
    
    const resp = await fetch(encodeURI(SUPABASE_URL + '/storage/v1/object/project_files/' + path), {
      method: 'POST',
      headers: { 
        'Authorization': 'Bearer ' + token,
        'apikey': SUPABASE_ANON_KEY
      },
      body: formData
    });
    
    if (resp.ok) {
      console.log('[Upload] Strategy 2 SUCCESS');
      await _recordMetadata(path, file, cat);
      return;
    }
    
    const errText = await resp.text();
    errors.push('FormData方式 HTTP ' + resp.status + ': ' + errText.substring(0, 200));
    console.warn('[Upload] Strategy 2 failed:', resp.status, errText);
  } catch(e) {
    errors.push('FormData方式异常: ' + e.message);
    console.warn('[Upload] Strategy 2 exception:', e.message);
  }
  
  // =========== STRATEGY 3: Raw fetch with file bytes directly ===========
  try {
    console.log('[Upload] Strategy 3: raw fetch + file bytes');
    const token = await getAccessToken();
    if (!token) { errors.push('无法获取JWT令牌'); throw new Error('No token'); }
    
    const resp = await fetch(encodeURI(SUPABASE_URL + '/storage/v1/object/project_files/' + path), {
      method: 'POST',
      headers: { 
        'Authorization': 'Bearer ' + token,
        'apikey': SUPABASE_ANON_KEY,
        'Content-Type': file.type || 'application/octet-stream'
      },
      body: file
    });
    
    if (resp.ok) {
      console.log('[Upload] Strategy 3 SUCCESS');
      await _recordMetadata(path, file, cat);
      return;
    }
    
    const errText = await resp.text();
    errors.push('直传方式 HTTP ' + resp.status + ': ' + errText.substring(0, 200));
    console.warn('[Upload] Strategy 3 failed:', resp.status, errText);
  } catch(e) {
    errors.push('直传方式异常: ' + e.message);
    console.warn('[Upload] Strategy 3 exception:', e.message);
  }
  
  // =========== ALL STRATEGIES FAILED ===========
  const fullError = errors.join('\n---\n');
  console.error('[Upload] ALL strategies failed:', errors);
  
  // Show detailed error panel
  _showUploadError(path, errors);
}

// Record file metadata to database
async function _recordMetadata(path, file, cat) {
  const { error: metaErr } = await sb.from('file_metadata').insert({
    filename: path,
    original_name: file.name,
    file_size: file.size,
    mime_type: file.type || 'application/octet-stream',
    storage_path: path,
    category: cat,
    project_id: currentProject ? currentProject.id : null,
    uploaded_by: currentUser.id
  });
  
  if (metaErr) {
    console.error('[Upload] Metadata insert failed:', metaErr);
    showToast('❌ 文件已上传但记录数据库失败: ' + (metaErr.message || '').substring(0, 100),'error');
    return;
  }
  
  showToast('✅ 上传成功','success');
  try { await logAction('上传文件', file.name + ' → ' + cat); } catch(e) {}
  renderFiles();
}

    window._fileCatResolve(cat);

  // Resume upload with selected category

}

  document.getElementById('fileCatModal').classList.remove('active');

    window._fileCatResolve(null);
    window._fileCatResolve = null;
  }
}

      <div style="background:#fff;padding:30px;border-radius:12px;max-width:500px;box-shadow:0 4px 20px rgba(0,0,0,.08)">
        <h2 style="margin-bottom:16px">⚙️ 首次配置</h2>
        <p style="margin-bottom:16px;color:#555;line-height:1.6">
          这个应用需要连接 Supabase 数据库。请在 <strong>index.html</strong> 文件中设置：
        </p>
        <ol style="text-align:left;color:#555;line-height:2;padding-left:20px;margin-bottom:16px">
          <li>打开 <strong>ogd-gantt-web/index.html</strong></li>
          <li>找到开头的 <code>SUPABASE_URL</code> 和 <code>SUPABASE_ANON_KEY</code></li>
          <li>填入你 Supabase 项目的对应值</li>
        </ol>
        <p style="color:#888;font-size:13px">完成后刷新页面即可。</p>
        <p style="margin-top:20px;padding-top:16px;border-top:1px solid #f0f0f0;color:#999;font-size:12px">
          还没有 Supabase 项目？请按 README.md 指引创建。
        </p>
      </div>`;
    return;
  }
  
  // Listen for auth state changes
  sb.auth.onAuthStateChange((event, session) => {
    if (event === 'SIGNED_IN' && session) {
      loadProfile(session.user);
    } else if (event === 'SIGNED_OUT') {
      currentUser = null;
      document.getElementById('loginPage').classList.remove('hide');
      document.getElementById('appMain').classList.add('hide');
    }
  });
  
  // Check existing session
  const hasSession = await checkSession();
  if (!hasSession) {
    loading.classList.add('hide');
    document.getElementById('loginPage').classList.remove('hide');
  }
}

init();
</script>
